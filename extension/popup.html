<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Follow Tracker Auto</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <h1>Follow Tracker Auto</h1>
      <p class="hint">
        El panel de control esta en la pagina de Instagram (esquina superior derecha). Este popup solo es un atajo.
      </p>
      <div id="tabStatus" class="tabStatus"></div>
      <div class="actions">
        <button id="startBtn">Iniciar (atajo)</button>
        <button id="cancelBtn" class="secondary" disabled>Cancelar</button>
      </div>
      <p class="footer">El popup se cierra al perder el foco. El panel flotante en IG no.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
