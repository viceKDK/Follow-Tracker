<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Follow Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand-row">
        <div class="brand-mark" aria-hidden="true">FT</div>
        <div>
          <p class="eyebrow">SEGUIDORES ANTES Y AHORA</p>
          <h1>Follow Tracker</h1>
        </div>
      </header>

      <section class="profile-card" aria-live="polite">
        <div class="profile-topline">
          <div>
            <p class="label">Perfil actual</p>
            <p id="profile-name" class="profile-name">Detectando...</p>
          </div>
          <span id="profile-state" class="state-pill">Revisando</span>
        </div>

        <p id="profile-help" class="profile-help">Abrí un perfil de Instagram para analizarlo.</p>

        <div id="mini-stats" class="mini-stats" hidden>
          <div><strong id="followers-count">0</strong><span>Te siguen</span></div>
          <div><strong id="following-count">0</strong><span>Seguís</span></div>
          <div><strong id="reports-count">0</strong><span>Reportes</span></div>
        </div>

        <div id="quality-summary" class="quality-summary" hidden>
          <div>
            <span class="label">Última captura</span>
            <strong id="quality-label">Sin evidencia</strong>
          </div>
          <span id="quality-score" class="quality-score">—</span>
        </div>

        <div id="pending-summary" class="pending-summary" hidden>
          Hay una captura esperando que la guardes o descartes en Instagram.
        </div>
      </section>

      <button id="analyze-button" class="button button-primary" type="button" disabled>
        <span class="button-icon" aria-hidden="true">↻</span>
        <span>
          <strong>Analizar perfil actual</strong>
          <small>Recolecta los datos y te deja revisarlos antes de guardar</small>
        </span>
      </button>

      <button id="dashboard-button" class="button button-secondary" type="button">
        <span class="button-icon" aria-hidden="true">⇆</span>
        <span>
          <strong>Ver antes y ahora</strong>
          <small>Compará reportes, personas, notas y actividad</small>
        </span>
        <span aria-hidden="true">→</span>
      </button>

      <button id="admin-button" class="button button-secondary button-compact" type="button">
        <span class="button-icon" aria-hidden="true">⚙</span>
        <span>
          <strong>Administrar datos</strong>
          <small>Importar archivos oficiales, backups y reportes</small>
        </span>
        <span aria-hidden="true">→</span>
      </button>

      <div id="message" class="message" hidden></div>

      <footer>
        <span>Todo se guarda localmente.</span>
        <button id="open-instagram" class="text-button" type="button">Abrir Instagram</button>
      </footer>
    </main>

    <script src="core.js"></script>
    <script src="history.js"></script>
    <script src="trust-core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
