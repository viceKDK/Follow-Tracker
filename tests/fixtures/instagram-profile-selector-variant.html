<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instagram · Selector drift fixture</title>
    <style>
      body { font: 16px system-ui, sans-serif; margin: 2rem auto; max-width: 42rem; }
      button { margin-right: .5rem; padding: .5rem .8rem; }
      [role="dialog"] { border: 1px solid #aaa; border-radius: 8px; min-width: 20rem; padding: 1rem; }
      [role="listitem"] { padding: .35rem 0; }
    </style>
  </head>
  <body data-profile="demo_profile">
    <header>
      <h1>Demo Profile</h1>
      <p>Fixture que evita href/textos semánticos en los triggers para probar adapters.</p>
      <button type="button" aria-label="Followers" data-ft-phase="followers">3</button>
      <button type="button" aria-label="Following" data-ft-phase="following">2</button>
    </header>

    <section role="dialog" aria-label="Followers" hidden data-ft-list="followers">
      <h2>Personas A</h2>
      <div>
        <div role="listitem" data-username="ana"><a href="/ana/">@ana</a></div>
        <div role="listitem" data-username="beto"><a href="/beto/">@beto</a></div>
        <div role="listitem" data-username="carla"><a href="/carla/">@carla</a></div>
      </div>
      <button type="button" aria-label="Close">×</button>
    </section>

    <section role="dialog" aria-label="Following" hidden data-ft-list="following">
      <h2>Personas B</h2>
      <div>
        <div role="listitem" data-username="ana"><a href="/ana/">@ana</a></div>
        <div role="listitem" data-username="diana"><a href="/diana/">@diana</a></div>
      </div>
      <button type="button" aria-label="Close">×</button>
    </section>

    <script>
      for (const phase of ['followers', 'following']) {
        const trigger = document.querySelector(`[data-ft-phase="${phase}"]`);
        const dialog = document.querySelector(`[data-ft-list="${phase}"]`);
        trigger.addEventListener('click', () => { dialog.hidden = false; });
        dialog.querySelector('button').addEventListener('click', () => { dialog.hidden = true; });
      }
    </script>
  </body>
</html>
