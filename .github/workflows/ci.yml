name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q comparar_ig.py auto_watcher.py analizar_csv.py
      - run: npm test
      - run: npm run check
      - run: npm run e2e:fixture
      - run: npm run e2e
