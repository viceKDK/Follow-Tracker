name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: npm run check
      - name: Empaquetar EXE y extension
        shell: pwsh
        run: ./build.ps1
      - name: Crear GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          dist/comparar_ig.exe
          dist/follow-tracker-extension.zip
          --generate-notes
          --title "Follow Tracker $env:GITHUB_REF_NAME"
