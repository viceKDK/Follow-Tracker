name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run check
      - run: npm run e2e:fixture
      - run: npm run e2e
      - name: Empaquetar extension
        run: |
          cd extension
          zip -r ../follow-tracker-extension.zip .
      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          follow-tracker-extension.zip
          --generate-notes
          --title "Follow Tracker $GITHUB_REF_NAME"
