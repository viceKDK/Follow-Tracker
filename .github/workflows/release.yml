name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: follow-tracker-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/release-manifest.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip \
            dist/*.sha256 \
            dist/release-manifest.json \
            --title "Follow Tracker ${GITHUB_REF_NAME}" \
            --generate-notes
