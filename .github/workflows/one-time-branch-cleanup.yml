name: One-time branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged working branches
        run: |
          for branch in \
            codex/extension-dashboard-history \
            feat/extension-dashboard-history \
            feat/follow-tracker-v2-dashboard
          do
            git push origin --delete "$branch" || true
          done
